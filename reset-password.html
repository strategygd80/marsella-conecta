<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer Contraseña — Marsella Conecta</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f6f9; --surface:#fff; --ink:#101828; --ink-muted:#667085; --accent:#0d67a7; --border:#e3e7ee; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px; padding: 32px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 4px 20px rgba(26,23,20,0.07); }
  h1 { font-family: 'Syne', sans-serif; font-size: 1.3rem; margin-bottom: 8px; }
  p { color: var(--ink-muted); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.5; }
  input { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; margin-bottom: 14px; font-size: 0.9rem; font-family: 'DM Sans', sans-serif; background: var(--bg); outline: none; }
  input:focus { border-color: var(--accent); background: #fff; }
  button { width: 100%; padding: 13px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
  button:hover { opacity: 0.9; }
  a { color: var(--accent); text-decoration: none; font-size: 0.82rem; display: inline-block; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>Nueva Contraseña</h1>
  <p>Elige una nueva contraseña para tu cuenta de Marsella Conecta.</p>
  <input type="password" id="newPassword" minlength="6" placeholder="Nueva contraseña (mín. 6 caracteres)">
  <button id="submitBtn" onclick="updatePassword()">Guardar Nueva Contraseña</button>
  <a href="index.html">← Volver al directorio</a>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://kydazssjktgsagayuupo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5ZGF6c3Nqa3Rnc2FnYXl1dXBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NTg2NTYsImV4cCI6MjEwMDQzNDY1Nn0.YPXJ2cJjTcKZDPTo2o6Wkhs3-9CGZISujsPvAwKWpx4';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

window.updatePassword = async function() {
  const btn = document.getElementById('submitBtn');
  const newPassword = document.getElementById('newPassword').value;
  if (!newPassword || newPassword.length < 6) {
    alert('La contraseña debe tener al menos 6 caracteres.');
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  const { error } = await supabase.auth.updateUser({ password: newPassword });
  btn.disabled = false;
  btn.textContent = 'Guardar Nueva Contraseña';
  if (error) {
    alert('No se pudo actualizar tu contraseña: ' + error.message + '\n\nEs posible que el enlace haya expirado — solicita uno nuevo desde "Iniciar Sesión".');
    return;
  }
  alert('¡Contraseña actualizada! Ya puedes iniciar sesión.');
  window.location.href = 'index.html';
};
</script>
</body>
</html>
